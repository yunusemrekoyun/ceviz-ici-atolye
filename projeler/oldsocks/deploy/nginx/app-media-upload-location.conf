# Bu blok oldscks.com API upstream'ini sunan `server` bloğuna eklenmelidir.
# `oldscks_backend` adı mevcut Node upstream adıyla değiştirilmelidir.

location ^~ /api/v1/media/uploads {
    # Uygulama 16 MiB parçalar gönderir; küçük protokol payı bırakılır.
    client_max_body_size 17m;
    client_body_timeout 10m;

    # Telefon yüklemelerinde parçayı önce Nginx diskine kopyalama; Node akışına doğrudan ilet.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 10m;
    proxy_send_timeout 10m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://oldscks_backend;
}
