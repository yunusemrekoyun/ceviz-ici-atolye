# media.oldscks.com için örnek origin yapılandırması.
# MEDIA_ROOT=/srv/oldscks/media olduğunda public dosyalar assets/ altındadır.

server {
    listen 80;
    listen [::]:80;
    server_name media.oldscks.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name media.oldscks.com;

    ssl_certificate /etc/letsencrypt/live/media.oldscks.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.oldscks.com/privkey.pem;

    root /srv/oldscks/media/assets;
    autoindex off;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    etag on;
    max_ranges 1;

    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    location ~ /\. {
        deny all;
    }

    # Profil görselleri değiştirilebilir/silinebilir; CDN tarafında da kısa TTL kullanılmalı.
    location ^~ /profile_image/ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Diğer yollar asset kimliğiyle versiyonlandığı için uzun süre güvenle cache'lenebilir.
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Timing-Allow-Origin "*" always;
    }

    access_log /var/log/nginx/media.oldscks.com.access.log combined buffer=64k flush=5s;
    error_log /var/log/nginx/media.oldscks.com.error.log warn;
}
