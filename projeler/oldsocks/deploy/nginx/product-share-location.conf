# deploy/scripts/urun-onizleme-nginx.sh bu dosyayı sunucuya /etc/nginx/snippets/oldscks-urun-onizleme.conf
# olarak yazar ve www.oldscks.com 443 bloğundaki "location /" öncesine include eder.
# Ürün linki WhatsApp/Instagram/Facebook'ta paylaşılınca önizlemede ürünün adı, fiyatı ve
# görseli çıksın diye ürün sayfasının HTML'i API'den (backend/services/sharePreview.js) gelir.
# API yanıt veremezse ya da 404 derse ziyaretçi her zamanki index.html'i alır; site etkilenmez.
# `127.0.0.1:5000` mevcut API upstream'iyle aynı olmalıdır.

location ^~ /product-details/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;

    # Yedek: normal /index.html yolu (her zamanki önbellek ve güvenlik başlıklarıyla).
    # Bu bloğa add_header eklemeyin; eklenirse sunucu düzeyindeki başlıklar burada kaybolur.
    proxy_intercept_errors on;
    error_page 404 500 502 503 504 = /index.html;
}
