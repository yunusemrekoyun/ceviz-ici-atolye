# Yerel geliştirme için MongoDB (replica set, transaction için gerekli) ve Mailpit.
# Kullanım: dev/yerel-ortam.sh baslat
name: oldsocks-dev
services:
  mongo:
    image: mongo:8.0.4
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27117:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27.8
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:1126:1025"
      - "127.0.0.1:8126:8025"
volumes:
  mongo-data:
